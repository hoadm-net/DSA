<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Stack bằng danh sách liên kết</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --key: #1971c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .field { min-width: 140px; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .list-scroll { overflow-x: auto; padding: 40px 4px 20px; }
  .list-container { display: flex; align-items: center; min-width: max-content; }
  .node-slot { display: flex; flex-direction: column; align-items: center; position: relative; }
  .top-label {
    position: absolute; top: -26px; font-size: 0.72rem; font-weight: 700; color: var(--current); white-space: nowrap;
  }
  .node {
    display: flex;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .node.flash { border-color: var(--key); box-shadow: 0 0 0 3px rgba(25,113,194,0.18); }
  .cell-value { padding: 12px 16px; font-weight: 700; min-width: 44px; text-align: center; }
  .cell-next { padding: 12px 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-left: 1px solid var(--border); min-width: 28px; }
  .arrow { width: 34px; text-align: center; color: var(--muted); font-size: 1.3rem; }
  .null-box { padding: 12px 14px; border: 2px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .status { font-size: 0.95rem; padding: 10px 12px; border-radius: 8px; background: #f1f3f5; min-height: 20px; }
  .status.error { background: #ffe3e3; color: #c92a2a; }
  .status.ok { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>
  <h1>Cài đặt Stack bằng danh sách liên kết</h1>
  <p class="subtitle">Push = thêm node vào đầu danh sách (top = head); Pop = xóa node đầu.</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field">
        <label>Giá trị</label>
        <input type="text" id="valueInput" value="5">
      </div>
      <button class="primary" id="pushBtn">Push</button>
      <button id="popBtn">Pop</button>
      <button id="topBtn">Top (Peek)</button>
      <button id="resetBtn">Reset (rỗng)</button>
    </div>
  </div>

  <div class="panel">
    <div class="list-scroll">
      <div class="list-container" id="listContainer"></div>
    </div>
    <div class="status" id="statusBox">Stack đang rỗng. Thử Push một vài giá trị.</div>
  </div>

<script>
  const valueInput = document.getElementById('valueInput');
  const pushBtn = document.getElementById('pushBtn');
  const popBtn = document.getElementById('popBtn');
  const topBtn = document.getElementById('topBtn');
  const resetBtn = document.getElementById('resetBtn');
  const listContainer = document.getElementById('listContainer');
  const statusBox = document.getElementById('statusBox');

  let stack = []; // stack[0] = head = top của stack
  let flashIndex = -1;

  function setStatus(text, kind) {
    statusBox.textContent = text;
    statusBox.className = 'status' + (kind ? ' ' + kind : '');
  }

  function render() {
    listContainer.innerHTML = '';
    if (stack.length === 0) {
      const nullBox = document.createElement('div');
      nullBox.className = 'null-box';
      nullBox.textContent = 'top = head = NULL (stack rỗng)';
      listContainer.appendChild(nullBox);
      return;
    }
    stack.forEach((v, i) => {
      const slot = document.createElement('div');
      slot.className = 'node-slot';
      slot.innerHTML = `
        ${i === 0 ? '<div class="top-label">top = head</div>' : ''}
        <div class="node ${i === flashIndex ? 'flash' : ''}">
          <div class="cell-value">${v}</div>
          <div class="cell-next">•</div>
        </div>
      `;
      listContainer.appendChild(slot);
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      listContainer.appendChild(arrow);
    });
    const nullSlot = document.createElement('div');
    nullSlot.innerHTML = '<div class="null-box">NULL</div>';
    listContainer.appendChild(nullSlot);
  }

  function push() {
    const v = valueInput.value.trim() || '0';
    stack.unshift(v);
    flashIndex = 0;
    render();
    setStatus(`Push(${v}) → tạo node mới, newNode.Next = head cũ, head = newNode.`, 'ok');
  }

  function pop() {
    if (stack.length === 0) {
      setStatus('Underflow! Stack đang rỗng, không thể Pop.', 'error');
      return;
    }
    const v = stack[0];
    flashIndex = 0;
    render();
    setStatus(`Pop() → lấy head.Data = ${v}, sau đó head = head.Next.`, 'ok');
    stack.shift();
    flashIndex = -1;
    setTimeout(render, 10);
  }

  function peek() {
    if (stack.length === 0) {
      setStatus('Stack đang rỗng, Top() không có giá trị để xem.', 'error');
      return;
    }
    flashIndex = 0;
    render();
    setStatus(`Top() → head.Data = ${stack[0]} (không thay đổi head).`, 'ok');
  }

  function reset() {
    stack = [];
    flashIndex = -1;
    render();
    setStatus('Đã reset stack về rỗng.');
  }

  pushBtn.addEventListener('click', push);
  popBtn.addEventListener('click', pop);
  topBtn.addEventListener('click', peek);
  resetBtn.addEventListener('click', reset);

  render();
</script>
</body>
</html>
