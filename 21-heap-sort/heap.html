<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Cấu trúc dữ liệu Heap</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --swap: #e03131;
    --sorted: #2f9e44;
    --node: #3b5bdb;
    --node-stroke: #2846b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"], .field input[type="number"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .field { min-width: 220px; flex: 2; }
  .field.small { min-width: 100px; flex: 0 0 100px; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--swap); color: #fff; border-color: var(--swap); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .tree-wrap { overflow-x: auto; }
  #treeSvg { display: block; margin: 0 auto; }
  .heap-array {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .heap-array .cell {
    border: 1px solid var(--border);
    border-radius: 6px;
    min-width: 40px;
    text-align: center;
    padding: 6px 4px;
    font-size: 0.85rem;
    background: #f8f9fb;
  }
  .heap-array .cell.hl { background: var(--current); color: #fff; border-color: var(--current); }
  .heap-array .cell .idx { display: block; font-size: 0.65rem; color: var(--muted); }
  .heap-array .cell.hl .idx { color: #fff8; }

  .status {
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 8px;
    background: #f1f3f5;
    min-height: 20px;
    margin-top: 14px;
  }
  .status.done { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>
  <h1>Cấu trúc dữ liệu Heap</h1>
  <p class="subtitle">Max-heap biểu diễn bằng mảng — thao tác Build Heap, Insert, Extract-Max, Update-Key.</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field">
        <label>Khởi tạo heap từ mảng (các số cách nhau bởi dấu phẩy)</label>
        <input type="text" id="initInput" value="8, 3, 15, 6, 22, 1, 19">
      </div>
      <button id="initBtn" class="primary">Build Heap</button>
      <button id="initRandomBtn">Ngẫu nhiên</button>
      <button id="initEmptyBtn">Heap rỗng</button>
    </div>
    <div class="controls-row">
      <div class="field small">
        <label>Giá trị</label>
        <input type="number" id="insertValue" value="12">
      </div>
      <button id="insertBtn" class="primary">Insert (Thêm)</button>
      <button id="extractBtn" class="danger">Extract-Max (Xóa)</button>
      <div class="field small">
        <label>Vị trí (index)</label>
        <input type="number" id="updateIndex" value="0" min="0">
      </div>
      <div class="field small">
        <label>Giá trị mới</label>
        <input type="number" id="updateValue" value="30">
      </div>
      <button id="updateBtn">Update-Key (Sửa)</button>
    </div>
    <div class="controls-row">
      <div class="speed-row">
        Tốc độ animation:
        <input type="range" id="heapSpeedSlider" min="150" max="1200" value="450" step="100">
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--current)"></span> Đang so sánh / vừa đổi chỗ</span>
      <span><span class="dot" style="background:var(--sorted)"></span> Node mới thêm / vừa cập nhật</span>
    </div>
  </div>

  <div class="panel">
    <div class="tree-wrap">
      <svg id="treeSvg" width="760" height="320"></svg>
    </div>
    <div class="heap-array" id="heapArrayView"></div>
    <div class="status" id="heapStatusBox">Nhập mảng và bấm "Build Heap" để bắt đầu.</div>
  </div>

<script>
  const initInput = document.getElementById('initInput');
  const initBtn = document.getElementById('initBtn');
  const initRandomBtn = document.getElementById('initRandomBtn');
  const initEmptyBtn = document.getElementById('initEmptyBtn');
  const insertValue = document.getElementById('insertValue');
  const insertBtn = document.getElementById('insertBtn');
  const extractBtn = document.getElementById('extractBtn');
  const updateIndex = document.getElementById('updateIndex');
  const updateValue = document.getElementById('updateValue');
  const updateBtn = document.getElementById('updateBtn');
  const heapSpeedSlider = document.getElementById('heapSpeedSlider');
  const treeSvg = document.getElementById('treeSvg');
  const heapArrayView = document.getElementById('heapArrayView');
  const heapStatusBox = document.getElementById('heapStatusBox');

  let heap = [];
  let busy = false;

  function setHeapStatus(text, ok) {
    heapStatusBox.textContent = text;
    heapStatusBox.className = 'status' + (ok ? ' done' : '');
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
  function speed() { return parseInt(heapSpeedSlider.value, 10); }

  function render(highlightSet) {
    const hl = highlightSet || new Set();
    heapArrayView.innerHTML = '';
    heap.forEach((v, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (hl.has(i) ? ' hl' : '');
      cell.innerHTML = `${v}<span class="idx">[${i}]</span>`;
      heapArrayView.appendChild(cell);
    });

    const n = heap.length;
    const svgW = 760, svgH = 320;
    treeSvg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
    if (n === 0) {
      treeSvg.innerHTML = `<text x="${svgW/2}" y="${svgH/2}" text-anchor="middle" fill="#9aa0ab" font-size="14">Heap rỗng</text>`;
      return;
    }
    const depth = Math.floor(Math.log2(n)) + 1;
    const levelHeight = Math.min(70, (svgH - 40) / depth);
    const positions = new Array(n);

    function computePos(i, xMin, xMax, level) {
      const x = (xMin + xMax) / 2;
      const y = 30 + level * levelHeight;
      positions[i] = { x, y };
      const l = 2 * i + 1, r = 2 * i + 2;
      if (l < n) computePos(l, xMin, x, level + 1);
      if (r < n) computePos(r, x, xMax, level + 1);
    }
    computePos(0, 10, svgW - 10, 0);

    let svgContent = '';
    for (let i = 0; i < n; i++) {
      const l = 2 * i + 1, r = 2 * i + 2;
      const p = positions[i];
      if (l < n) {
        const c = positions[l];
        svgContent += `<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}" stroke="#c7cbd4" stroke-width="2"/>`;
      }
      if (r < n) {
        const c = positions[r];
        svgContent += `<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}" stroke="#c7cbd4" stroke-width="2"/>`;
      }
    }
    const radius = 18;
    for (let i = 0; i < n; i++) {
      const p = positions[i];
      const isHl = hl.has(i);
      const fill = isHl ? '#f08c00' : 'var(--node)';
      const stroke = isHl ? '#c96a00' : 'var(--node-stroke)';
      svgContent += `
        <circle cx="${p.x}" cy="${p.y}" r="${radius}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
        <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">${heap[i]}</text>
        <text x="${p.x}" y="${p.y + radius + 13}" text-anchor="middle" fill="#9aa0ab" font-size="10">[${i}]</text>
      `;
    }
    treeSvg.innerHTML = svgContent;
  }

  function parseInit() {
    return initInput.value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
  }

  function buildHeapFromArray(arr) {
    heap = arr.slice();
    const n = heap.length;
    for (let i = Math.floor(n / 2) - 1; i >= 0; i--) heapifyDown(i);
  }

  function heapifyDown(i) {
    const n = heap.length;
    let largest = i;
    const l = 2 * i + 1, r = 2 * i + 2;
    if (l < n && heap[l] > heap[largest]) largest = l;
    if (r < n && heap[r] > heap[largest]) largest = r;
    if (largest !== i) {
      [heap[i], heap[largest]] = [heap[largest], heap[i]];
      heapifyDown(largest);
    }
  }

  async function heapifyDownAnimated(i) {
    const n = heap.length;
    while (true) {
      let largest = i;
      const l = 2 * i + 1, r = 2 * i + 2;
      render(new Set([i, l, r].filter(x => x < n)));
      setHeapStatus(`Heapify: so sánh A[${i}]=${heap[i]} với con trái/phải.`);
      await sleep(speed());
      if (l < n && heap[l] > heap[largest]) largest = l;
      if (r < n && heap[r] > heap[largest]) largest = r;
      if (largest === i) break;
      [heap[i], heap[largest]] = [heap[largest], heap[i]];
      render(new Set([i, largest]));
      setHeapStatus(`Đổi chỗ A[${i}] và A[${largest}] (đẩy xuống).`);
      await sleep(speed());
      i = largest;
    }
  }

  async function siftUpAnimated(i) {
    while (i > 0) {
      const parent = Math.floor((i - 1) / 2);
      render(new Set([i, parent]));
      setHeapStatus(`So sánh A[${i}]=${heap[i]} với cha A[${parent}]=${heap[parent]}.`);
      await sleep(speed());
      if (heap[parent] >= heap[i]) break;
      [heap[i], heap[parent]] = [heap[parent], heap[i]];
      render(new Set([i, parent]));
      setHeapStatus(`Đổi chỗ A[${i}] và A[${parent}] (đẩy lên).`);
      await sleep(speed());
      i = parent;
    }
  }

  async function withBusyLock(fn) {
    if (busy) return;
    busy = true;
    setControlsDisabled(true);
    await fn();
    setControlsDisabled(false);
    busy = false;
  }

  function setControlsDisabled(disabled) {
    [initBtn, initRandomBtn, initEmptyBtn, insertBtn, extractBtn, updateBtn].forEach(b => b.disabled = disabled);
  }

  initBtn.addEventListener('click', () => withBusyLock(async () => {
    buildHeapFromArray(parseInit());
    render();
    setHeapStatus(`Đã xây dựng max-heap từ ${heap.length} phần tử (Build Heap — O(n)).`, true);
  }));

  initRandomBtn.addEventListener('click', () => {
    const n = 6 + Math.floor(Math.random() * 5);
    const arr = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 40));
    initInput.value = arr.join(', ');
    initBtn.click();
  });

  initEmptyBtn.addEventListener('click', () => withBusyLock(async () => {
    heap = [];
    render();
    setHeapStatus('Heap rỗng. Dùng Insert để thêm phần tử.');
  }));

  insertBtn.addEventListener('click', () => withBusyLock(async () => {
    const v = parseInt(insertValue.value, 10);
    if (isNaN(v)) { setHeapStatus('Giá trị không hợp lệ.'); return; }
    heap.push(v);
    const i = heap.length - 1;
    render(new Set([i]));
    setHeapStatus(`Thêm ${v} vào cuối mảng (vị trí ${i}), chuẩn bị sift-up.`);
    await sleep(speed());
    await siftUpAnimated(i);
    render();
    setHeapStatus(`Insert(${v}) hoàn tất — O(log n).`, true);
  }));

  extractBtn.addEventListener('click', () => withBusyLock(async () => {
    if (heap.length === 0) { setHeapStatus('Heap rỗng, không thể Extract-Max.'); return; }
    const max = heap[0];
    const last = heap.length - 1;
    render(new Set([0, last]));
    setHeapStatus(`Lấy A[0]=${max} (lớn nhất). Đưa phần tử cuối A[${last}]=${heap[last]} lên gốc.`);
    await sleep(speed());
    heap[0] = heap[last];
    heap.pop();
    render(new Set([0]));
    await sleep(speed());
    if (heap.length > 0) await heapifyDownAnimated(0);
    render();
    setHeapStatus(`Extract-Max trả về ${max} — O(log n).`, true);
  }));

  updateBtn.addEventListener('click', () => withBusyLock(async () => {
    const i = parseInt(updateIndex.value, 10);
    const v = parseInt(updateValue.value, 10);
    if (isNaN(i) || i < 0 || i >= heap.length) { setHeapStatus('Vị trí (index) không hợp lệ.'); return; }
    if (isNaN(v)) { setHeapStatus('Giá trị mới không hợp lệ.'); return; }
    const old = heap[i];
    heap[i] = v;
    render(new Set([i]));
    setHeapStatus(`Update-Key: A[${i}] từ ${old} → ${v}.`);
    await sleep(speed());
    if (v > old) {
      await siftUpAnimated(i);
    } else if (v < old) {
      await heapifyDownAnimated(i);
    }
    render();
    setHeapStatus(`Update-Key hoàn tất — O(log n).`, true);
  }));

  buildHeapFromArray(parseInit());
  render();
</script>
</body>
</html>
