<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Thêm node vào đầu/cuối danh sách</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --sorted: #2f9e44;
    --key: #1971c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .field { min-width: 220px; }
  .field.wide { flex: 2; min-width: 260px; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .list-scroll { overflow-x: auto; padding: 40px 4px 20px; }
  .list-container { display: flex; align-items: center; min-width: max-content; }
  .node-slot { display: flex; flex-direction: column; align-items: center; position: relative; }
  .head-label, .pointer-label {
    position: absolute;
    top: -26px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .head-label { color: var(--accent); }
  .pointer-label { color: var(--current); }
  .node {
    display: flex;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .node.current { border-color: var(--current); box-shadow: 0 0 0 3px rgba(240,140,0,0.18); }
  .node.new { border-color: var(--key); box-shadow: 0 0 0 3px rgba(25,113,194,0.18); }
  .cell-value { padding: 12px 16px; font-weight: 700; min-width: 44px; text-align: center; }
  .cell-next { padding: 12px 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-left: 1px solid var(--border); min-width: 28px; }
  .arrow { width: 34px; text-align: center; color: var(--muted); font-size: 1.3rem; }
  .null-box { padding: 12px 14px; border: 2px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .status { font-size: 0.95rem; padding: 10px 12px; border-radius: 8px; background: #f1f3f5; min-height: 20px; }
  .status.done { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>
  <h1>Thêm node vào đầu/cuối danh sách</h1>
  <p class="subtitle">Thêm vào đầu chỉ cần cập nhật con trỏ (O(1)); thêm vào cuối (không giữ tail) phải duyệt tìm node cuối (O(n)).</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field wide">
        <label>Danh sách ban đầu (cách nhau bởi dấu phẩy)</label>
        <input type="text" id="listInput" value="5, 8, 3, 19">
      </div>
      <button class="primary" id="initBtn">Khởi tạo danh sách</button>
    </div>
    <div class="controls-row">
      <div class="field">
        <label>Giá trị cần thêm</label>
        <input type="text" id="valueInput" value="42">
      </div>
      <button id="insertHeadBtn">Thêm vào đầu</button>
      <button id="insertTailBtn">Thêm vào cuối</button>
    </div>
    <div class="controls-row">
      <button id="stepBtn">Từng bước</button>
      <button id="runBtn">Chạy tự động</button>
      <div class="speed-row">
        Tốc độ:
        <input type="range" id="speedSlider" min="200" max="1500" value="600" step="100">
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--current)"></span> Con trỏ p đang duyệt</span>
      <span><span class="dot" style="background:var(--key)"></span> Node vừa thêm</span>
    </div>
  </div>

  <div class="panel">
    <div class="list-scroll">
      <div class="list-container" id="listContainer"></div>
    </div>
    <div class="status" id="statusBox">Khởi tạo danh sách rồi chọn "Thêm vào đầu" hoặc "Thêm vào cuối".</div>
  </div>

<script>
  const listInput = document.getElementById('listInput');
  const valueInput = document.getElementById('valueInput');
  const initBtn = document.getElementById('initBtn');
  const insertHeadBtn = document.getElementById('insertHeadBtn');
  const insertTailBtn = document.getElementById('insertTailBtn');
  const stepBtn = document.getElementById('stepBtn');
  const runBtn = document.getElementById('runBtn');
  const speedSlider = document.getElementById('speedSlider');
  const listContainer = document.getElementById('listContainer');
  const statusBox = document.getElementById('statusBox');

  let list = [];
  let steps = [];
  let stepPos = 0;
  let pointer = -1;
  let newIndex = -1;
  let busy = false;

  function parseList() {
    return listInput.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
  }

  function renderList() {
    listContainer.innerHTML = '';
    if (list.length === 0) {
      const nullBox = document.createElement('div');
      nullBox.className = 'null-box';
      nullBox.textContent = 'head = NULL (danh sách rỗng)';
      listContainer.appendChild(nullBox);
      return;
    }
    list.forEach((v, i) => {
      const slot = document.createElement('div');
      slot.className = 'node-slot';
      let label = i === 0 ? 'head' : '';
      let labelClass = 'head-label';
      if (pointer === i) { label = label ? label + ' / p' : 'p'; labelClass = 'pointer-label'; }

      const nodeClasses = ['node'];
      if (pointer === i) nodeClasses.push('current');
      if (newIndex === i) nodeClasses.push('new');

      slot.innerHTML = `
        ${label ? `<div class="${labelClass}">${label}</div>` : ''}
        <div class="${nodeClasses.join(' ')}">
          <div class="cell-value">${v}</div>
          <div class="cell-next">•</div>
        </div>
      `;
      listContainer.appendChild(slot);

      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      listContainer.appendChild(arrow);
    });
    const nullSlot = document.createElement('div');
    nullSlot.innerHTML = '<div class="null-box">NULL</div>';
    listContainer.appendChild(nullSlot);
  }

  function setStatus(text, isDone) {
    statusBox.textContent = text;
    statusBox.className = 'status' + (isDone ? ' done' : '');
  }

  function initList() {
    list = parseList();
    steps = [];
    stepPos = 0;
    pointer = -1;
    newIndex = -1;
    busy = false;
    renderList();
    setStatus(`Đã khởi tạo danh sách gồm ${list.length} node.`);
    stepBtn.disabled = true;
    runBtn.disabled = true;
  }

  function buildInsertHeadSteps(value) {
    const s = [];
    s.push({ type: 'note', text: `Tạo node mới chứa giá trị ${value}.` });
    s.push({
      type: 'note',
      text: list.length
        ? `Gán newNode.Next = head hiện tại (node ${list[0]}).`
        : 'Gán newNode.Next = NULL (danh sách đang rỗng).',
    });
    s.push({ type: 'insertHead', value, text: 'Cập nhật head = newNode. Node mới đã trở thành đầu danh sách.' });
    s.push({ type: 'done', text: 'Hoàn tất thêm vào đầu danh sách!' });
    return s;
  }

  function buildInsertTailSteps(value) {
    const s = [];
    if (list.length === 0) {
      s.push({ type: 'note', text: `Tạo node mới chứa giá trị ${value}, gán Next = NULL.` });
      s.push({ type: 'insertHead', value, text: 'Danh sách đang rỗng → head = newNode.' });
      s.push({ type: 'done', text: 'Hoàn tất thêm vào danh sách!' });
      return s;
    }
    s.push({ type: 'note', text: `Tạo node mới chứa giá trị ${value}, gán Next = NULL.` });
    for (let i = 0; i < list.length; i++) {
      s.push({
        type: 'move',
        index: i,
        text: i === 0 ? `p = head → p trỏ tới node ${list[0]}.` : `p = p.Next → p trỏ tới node ${list[i]}.`,
      });
    }
    s.push({ type: 'insertTail', value, text: 'p.Next đang là NULL (đã tới node cuối) → gán p.Next = newNode.' });
    s.push({ type: 'done', text: 'Hoàn tất thêm vào cuối danh sách!' });
    return s;
  }

  function startOperation(builtSteps) {
    steps = builtSteps;
    stepPos = 0;
    pointer = -1;
    newIndex = -1;
    busy = true;
    renderList();
    setStatus('Nhấn "Từng bước" hoặc "Chạy tự động" để xem thao tác diễn ra.');
    stepBtn.disabled = false;
    runBtn.disabled = false;
  }

  function applyStep(s) {
    switch (s.type) {
      case 'note':
        pointer = -1;
        break;
      case 'move':
        pointer = s.index;
        break;
      case 'insertHead':
        list.unshift(s.value);
        pointer = -1;
        newIndex = 0;
        break;
      case 'insertTail':
        list.push(s.value);
        pointer = -1;
        newIndex = list.length - 1;
        break;
      case 'done':
        pointer = -1;
        break;
    }
  }

  function step() {
    if (!busy || stepPos >= steps.length) return;
    const s = steps[stepPos];
    applyStep(s);
    renderList();
    setStatus(s.text, s.type === 'done');
    stepPos++;
    if (s.type === 'done') {
      busy = false;
      stepBtn.disabled = true;
      runBtn.disabled = true;
    }
  }

  let autoTimer = null;
  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }
  function runAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      step();
      if (!busy) stopAuto();
    }, parseInt(speedSlider.value, 10));
  }

  initBtn.addEventListener('click', initList);
  insertHeadBtn.addEventListener('click', () => {
    const v = valueInput.value.trim() || '0';
    startOperation(buildInsertHeadSteps(v));
  });
  insertTailBtn.addEventListener('click', () => {
    const v = valueInput.value.trim() || '0';
    startOperation(buildInsertTailSteps(v));
  });
  stepBtn.addEventListener('click', step);
  runBtn.addEventListener('click', runAuto);

  initList();
</script>
</body>
</html>
