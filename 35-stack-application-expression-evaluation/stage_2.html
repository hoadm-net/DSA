<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage 2: Tính giá trị Postfix</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --key: #1971c2;
    --sorted: #2f9e44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .subtitle a { color: var(--accent); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
    font-family: ui-monospace, monospace;
  }
  .field { min-width: 260px; flex: 2; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .stage-label {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: #e7f0ff; color: var(--accent); font-size: 0.78rem; font-weight: 700; margin-bottom: 12px;
  }
  .row-title { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .token-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; min-height: 36px; }
  .token {
    padding: 7px 12px; border: 2px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, monospace; font-weight: 700; background: #fff;
  }
  .token.current { border-color: var(--current); background: #fff3bf; }
  .stack-row { display: flex; gap: 20px; align-items: flex-start; }
  .stack-col { display: flex; flex-direction: column; }
  .stack-visual { display: flex; flex-direction: column-reverse; width: 90px; min-height: 40px; }
  .stack-slot {
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border); border-top: none; height: 40px;
    font-family: ui-monospace, monospace; font-weight: 700; background: #fff;
  }
  /* column-reverse: phần tử cuối nằm trên cùng nên cần viền trên */
  .stack-visual .stack-slot:last-child { border-top: 2px solid var(--border); }
  .stack-slot.top { border-color: var(--key); background: #e7f0ff; }
  .stack-empty { font-size: 0.78rem; color: var(--muted); border: 2px dashed var(--border); border-radius: 6px; padding: 10px; text-align:center; width: 90px; }
  .result-banner {
    text-align: center; padding: 24px; font-size: 1.6rem; font-weight: 800; color: var(--sorted);
    background: #d3f9d8; border-radius: 10px;
  }
  .status { font-size: 0.95rem; padding: 10px 12px; border-radius: 8px; background: #f1f3f5; min-height: 20px; margin-top: 14px; }
  .status.ok { background: #d3f9d8; color: #2b8a3e; }
  .status.error { background: #ffe3e3; color: #c92a2a; }
</style>
</head>
<body>
  <h1>Stage 2: Tính giá trị Postfix bằng Stack</h1>
  <p class="subtitle">Duyệt chuỗi hậu tố từ trái sang phải: gặp toán hạng thì đẩy vào Stack, gặp toán tử thì lấy 2 toán hạng ra tính rồi đẩy kết quả lại. Bước trước: <a href="stage_1.html">Stage 1 – Chuyển Infix → Postfix</a>.</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field">
        <label>Biểu thức Postfix (mỗi token cách nhau bởi khoảng trắng)</label>
        <input type="text" id="exprInput" value="3 4 2 * + 1 5 + 2 / -">
      </div>
      <button class="primary" id="initBtn">Bắt đầu</button>
    </div>
    <div class="controls-row">
      <button id="stepBtn">Từng bước</button>
      <button id="runBtn">Chạy tự động</button>
      <div class="speed-row">
        Tốc độ:
        <input type="range" id="speedSlider" min="150" max="1200" value="450" step="100">
      </div>
    </div>
  </div>

  <div class="panel" id="workPanel"></div>

<script>
  const exprInput = document.getElementById('exprInput');
  const initBtn = document.getElementById('initBtn');
  const stepBtn = document.getElementById('stepBtn');
  const runBtn = document.getElementById('runBtn');
  const speedSlider = document.getElementById('speedSlider');
  const workPanel = document.getElementById('workPanel');

  const OPS = ['+', '-', '*', '/', '^'];
  const isOperand = t => /^[0-9]+(\.[0-9]+)?$/.test(t);

  let tokens = [];
  let steps = [];
  let stepPos = 0;

  let evalStack = [];
  let currentReadIndex = -1;
  let finalResult = null;
  let done = false;
  let statusText = '';
  let statusKind = '';
  let busy = false;

  // ---- Giải thuật: sinh danh sách các bước tính giá trị Postfix ----
  // Postfix nhập tay có thể sai, nên gặp lỗi thì dừng bằng một bước 'error'.
  function simulate(toks) {
    const steps = [];
    const evalSt = [];
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      steps.push({ type: 'read', index: i, text: `Đọc token "${t}" trong chuỗi postfix.` });
      if (isOperand(t)) {
        evalSt.push(Number(t));
        steps.push({ type: 'push', value: Number(t), text: `"${t}" là toán hạng → đẩy vào ngăn xếp toán hạng.` });
      } else if (OPS.includes(t)) {
        if (evalSt.length < 2) {
          steps.push({ type: 'error', text: `Lỗi: gặp toán tử "${t}" nhưng ngăn xếp chỉ có ${evalSt.length} toán hạng (cần 2). Postfix không hợp lệ.` });
          return steps;
        }
        const b = evalSt.pop();
        const a = evalSt.pop();
        let r;
        switch (t) {
          case '+': r = a + b; break;
          case '-': r = a - b; break;
          case '*': r = a * b; break;
          case '/': r = a / b; break;
          case '^': r = Math.pow(a, b); break;
        }
        steps.push({ type: 'pop2', text: `Gặp toán tử "${t}" → lấy 2 toán hạng ${b} rồi ${a} ra khỏi ngăn xếp.` });
        evalSt.push(r);
        steps.push({ type: 'push', value: r, text: `Tính ${a} ${t} ${b} = ${r} → đẩy kết quả vào ngăn xếp.` });
      } else {
        steps.push({ type: 'error', text: `Lỗi: token "${t}" không phải số hay toán tử hợp lệ (+ - * / ^).` });
        return steps;
      }
    }
    if (evalSt.length !== 1) {
      steps.push({ type: 'error', text: `Lỗi: hết chuỗi nhưng ngăn xếp còn ${evalSt.length} phần tử (phải đúng 1). Postfix không hợp lệ.` });
      return steps;
    }
    steps.push({ type: 'done', text: `Hoàn tất tính giá trị. Kết quả cuối cùng = ${evalSt[0]}.` });
    return steps;
  }

  function renderStackCol(title, arr, highlightTop) {
    const items = arr.map((v, i) => {
      const isTop = i === arr.length - 1;
      return `<div class="stack-slot ${isTop && highlightTop ? 'top' : ''}">${v}</div>`;
    }).join('');
    return `
      <div class="stack-col">
        <div class="row-title">${title}</div>
        ${arr.length ? `<div class="stack-visual">${items}</div>` : `<div class="stack-empty">rỗng</div>`}
      </div>
    `;
  }

  function renderTokenRow(title, arr, highlightIndex) {
    const chips = arr.map((t, i) => `<div class="token ${i === highlightIndex ? 'current' : ''}">${t}</div>`).join('');
    return `
      <div class="row-title">${title}</div>
      <div class="token-row">${chips.length ? chips : '<span style="color:var(--muted);font-size:0.85rem;">(trống)</span>'}</div>
    `;
  }

  function render() {
    let html = '';
    if (!done) {
      html += '<div class="stage-label">Stage 2: Tính giá trị Postfix</div>';
      html += renderTokenRow('Chuỗi Postfix', tokens, currentReadIndex);
      html += `<div class="stack-row">${renderStackCol('Ngăn xếp toán hạng', evalStack, true)}</div>`;
    } else {
      html += renderTokenRow('Chuỗi Postfix', tokens, -1);
      html += `<div class="result-banner">Kết quả = ${finalResult}</div>`;
    }
    workPanel.innerHTML = html;

    const statusEl = document.createElement('div');
    statusEl.className = 'status' + (statusKind ? ' ' + statusKind : '');
    statusEl.textContent = statusText;
    workPanel.appendChild(statusEl);
  }

  function applyStep(s) {
    switch (s.type) {
      case 'read': currentReadIndex = s.index; break;
      case 'push': evalStack.push(s.value); break;
      case 'pop2': evalStack.pop(); evalStack.pop(); break;
      case 'done':
        finalResult = evalStack[0];
        done = true;
        break;
    }
  }

  function initAll() {
    stopAuto();
    tokens = exprInput.value.trim().split(/\s+/).filter(Boolean);
    steps = simulate(tokens);
    stepPos = 0;
    evalStack = [];
    currentReadIndex = -1;
    finalResult = null;
    done = false;
    busy = true;
    statusText = `Sẵn sàng tính chuỗi postfix gồm ${tokens.length} token.`;
    statusKind = '';
    render();
    stepBtn.disabled = false;
    runBtn.disabled = false;
  }

  function step() {
    if (!busy || stepPos >= steps.length) return;
    const s = steps[stepPos];
    applyStep(s);
    statusText = s.text;
    statusKind = s.type === 'done' ? 'ok' : s.type === 'error' ? 'error' : '';
    render();
    stepPos++;
    if (s.type === 'done' || s.type === 'error') {
      busy = false;
      stopAuto();
      stepBtn.disabled = true;
      runBtn.disabled = true;
    }
  }

  let autoTimer = null;
  function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function runAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      step();
      if (!busy) stopAuto();
    }, parseInt(speedSlider.value, 10));
  }

  initBtn.addEventListener('click', initAll);
  stepBtn.addEventListener('click', step);
  runBtn.addEventListener('click', runAuto);

  // Nếu mở từ Stage 1 thì nhận sẵn chuỗi postfix qua ?postfix=...
  const fromStage1 = new URLSearchParams(location.search).get('postfix');
  if (fromStage1) exprInput.value = fromStage1;

  initAll();
</script>
</body>
</html>
