<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Danh sách liên kết vòng</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --loop: #ae3ec9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .field { min-width: 260px; flex: 2; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .lap-badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: #f3e8ff; color: var(--loop); font-size: 0.8rem; font-weight: 700;
  }
  .list-scroll { overflow-x: auto; padding: 40px 4px 20px; }
  .list-container { display: flex; align-items: center; min-width: max-content; }
  .node-slot { display: flex; flex-direction: column; align-items: center; position: relative; }
  .head-label, .pointer-label {
    position: absolute; top: -26px; font-size: 0.72rem; font-weight: 700; white-space: nowrap;
  }
  .head-label { color: var(--accent); }
  .pointer-label { color: var(--current); }
  .node {
    display: flex;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .node.current { border-color: var(--current); box-shadow: 0 0 0 3px rgba(240,140,0,0.18); }
  .cell-value { padding: 12px 16px; font-weight: 700; min-width: 44px; text-align: center; }
  .cell-next { padding: 12px 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-left: 1px solid var(--border); min-width: 28px; }
  .arrow { width: 34px; text-align: center; color: var(--muted); font-size: 1.3rem; }
  .wrap-arrow {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--loop); font-size: 0.8rem; font-weight: 700; padding: 0 8px; text-align: center;
  }
  .wrap-arrow .glyph { font-size: 1.3rem; }
  .status { font-size: 0.95rem; padding: 10px 12px; border-radius: 8px; background: #f1f3f5; min-height: 20px; }
  .status.warn { background: #fff3bf; color: #997404; }
</style>
</head>
<body>
  <h1>Danh sách liên kết vòng</h1>
  <p class="subtitle">Node cuối cùng không trỏ tới NULL, mà trỏ ngược về head — danh sách không có điểm kết thúc tự nhiên.</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field">
        <label>Danh sách ban đầu (cách nhau bởi dấu phẩy)</label>
        <input type="text" id="listInput" value="5, 8, 3, 19, 6">
      </div>
      <button class="primary" id="initBtn">Khởi tạo danh sách vòng</button>
    </div>
    <div class="controls-row">
      <button id="stepBtn">Từng bước (p = p.Next)</button>
      <button id="runBtn">Chạy tự động</button>
      <button id="resetBtn">Reset</button>
      <div class="speed-row">
        Tốc độ:
        <input type="range" id="speedSlider" min="200" max="1200" value="500" step="100">
      </div>
      <span class="lap-badge" id="lapBadge">Chưa bắt đầu</span>
    </div>
  </div>

  <div class="panel">
    <div class="list-scroll">
      <div class="list-container" id="listContainer"></div>
    </div>
    <div class="status" id="statusBox">Khởi tạo danh sách rồi nhấn "Từng bước" để duyệt vòng quanh.</div>
  </div>

<script>
  const listInput = document.getElementById('listInput');
  const initBtn = document.getElementById('initBtn');
  const stepBtn = document.getElementById('stepBtn');
  const runBtn = document.getElementById('runBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedSlider = document.getElementById('speedSlider');
  const listContainer = document.getElementById('listContainer');
  const statusBox = document.getElementById('statusBox');
  const lapBadge = document.getElementById('lapBadge');

  const MAX_LAPS = 3;
  let list = [];
  let pointer = -1;
  let lap = 0;
  let stepsTaken = 0;
  let stopped = false;
  let autoTimer = null;

  function parseList() {
    return listInput.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
  }

  function setStatus(text, kind) {
    statusBox.textContent = text;
    statusBox.className = 'status' + (kind ? ' ' + kind : '');
  }

  function renderList() {
    listContainer.innerHTML = '';
    if (list.length === 0) {
      const box = document.createElement('div');
      box.className = 'node-slot';
      box.textContent = 'Danh sách rỗng.';
      listContainer.appendChild(box);
      return;
    }
    list.forEach((v, i) => {
      const slot = document.createElement('div');
      slot.className = 'node-slot';
      let label = i === 0 ? 'head' : '';
      let labelClass = 'head-label';
      if (pointer === i) { label = label ? label + ' / p' : 'p'; labelClass = 'pointer-label'; }

      slot.innerHTML = `
        ${label ? `<div class="${labelClass}">${label}</div>` : ''}
        <div class="node ${pointer === i ? 'current' : ''}">
          <div class="cell-value">${v}</div>
          <div class="cell-next">•</div>
        </div>
      `;
      listContainer.appendChild(slot);

      if (i < list.length - 1) {
        const arrow = document.createElement('div');
        arrow.className = 'arrow';
        arrow.textContent = '→';
        listContainer.appendChild(arrow);
      }
    });

    const wrap = document.createElement('div');
    wrap.className = 'wrap-arrow';
    wrap.innerHTML = `<span class="glyph">↩</span><span>quay về head</span>`;
    listContainer.appendChild(wrap);
  }

  function updateLapBadge() {
    lapBadge.textContent = pointer === -1 ? 'Chưa bắt đầu' : `Vòng thứ ${lap} — đã đi ${stepsTaken} bước`;
  }

  function initList() {
    stopAuto();
    list = parseList();
    pointer = -1;
    lap = 0;
    stepsTaken = 0;
    stopped = false;
    renderList();
    updateLapBadge();
    setStatus(`Đã khởi tạo danh sách liên kết vòng gồm ${list.length} node.`);
    stepBtn.disabled = false;
    runBtn.disabled = false;
  }

  function step() {
    if (stopped || list.length === 0) return;
    if (pointer === -1) {
      pointer = 0;
      lap = 1;
      stepsTaken = 1;
      setStatus(`p = head → p trỏ tới node có Data = ${list[0]}.`);
    } else {
      const wrapped = pointer === list.length - 1;
      pointer = (pointer + 1) % list.length;
      stepsTaken++;
      if (wrapped) {
        lap++;
        setStatus(`p = p.Next → quay lại head (Data = ${list[0]})! Đây là vòng thứ ${lap}. Vì không có NULL, việc duyệt sẽ tiếp diễn vô hạn nếu không có điều kiện dừng đúng.`);
      } else {
        setStatus(`p = p.Next → p trỏ tới node có Data = ${list[pointer]}.`);
      }
    }
    renderList();
    updateLapBadge();

    if (lap > MAX_LAPS) {
      stopped = true;
      stopAuto();
      setStatus(`Đã dừng demo sau ${MAX_LAPS} vòng để minh họa: danh sách vòng không có điểm kết thúc tự nhiên, một giải thuật thực tế PHẢI tự đặt điều kiện dừng (ví dụ so sánh p == head).`, 'warn');
      stepBtn.disabled = true;
      runBtn.disabled = true;
    }
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }
  function runAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      step();
      if (stopped) stopAuto();
    }, parseInt(speedSlider.value, 10));
  }

  initBtn.addEventListener('click', initList);
  stepBtn.addEventListener('click', step);
  runBtn.addEventListener('click', runAuto);
  resetBtn.addEventListener('click', initList);

  initList();
</script>
</body>
</html>
