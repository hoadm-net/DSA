<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Khởi tạo & duyệt danh sách liên kết đơn</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --swap: #e03131;
    --sorted: #2f9e44;
    --key: #1971c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .field { min-width: 260px; flex: 2; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .list-scroll { overflow-x: auto; padding: 40px 4px 20px; }
  .list-container { display: flex; align-items: center; min-width: max-content; }
  .node-slot { display: flex; flex-direction: column; align-items: center; position: relative; }
  .head-label {
    position: absolute;
    top: -26px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
  }
  .pointer-label {
    position: absolute;
    top: -26px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--current);
  }
  .node {
    display: flex;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .node.current { border-color: var(--current); box-shadow: 0 0 0 3px rgba(240,140,0,0.18); }
  .node.visited { opacity: 0.55; }
  .cell-value {
    padding: 12px 16px;
    font-weight: 700;
    min-width: 44px;
    text-align: center;
  }
  .cell-next {
    padding: 12px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    border-left: 1px solid var(--border);
    min-width: 28px;
  }
  .arrow { width: 34px; text-align: center; color: var(--muted); font-size: 1.3rem; }
  .null-box {
    padding: 12px 14px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
  }
  .status {
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 8px;
    background: #f1f3f5;
    min-height: 20px;
  }
  .status.done { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>
  <h1>Khởi tạo và duyệt danh sách liên kết đơn</h1>
  <p class="subtitle">Con trỏ p đi từ head qua từng node theo liên kết Next, cho tới khi gặp NULL.</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field">
        <label>Giá trị các node (cách nhau bởi dấu phẩy, theo thứ tự từ head)</label>
        <input type="text" id="listInput" value="5, 8, 3, 19, 6">
      </div>
      <button class="primary" id="initBtn">Khởi tạo danh sách</button>
    </div>
    <div class="controls-row">
      <button id="stepBtn">Từng bước</button>
      <button id="runBtn">Chạy tự động</button>
      <button id="resetBtn">Reset (p về head)</button>
      <div class="speed-row">
        Tốc độ:
        <input type="range" id="speedSlider" min="200" max="1500" value="600" step="100">
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="list-scroll">
      <div class="list-container" id="listContainer"></div>
    </div>
    <div class="status" id="statusBox">Nhập giá trị rồi nhấn "Khởi tạo danh sách" để bắt đầu.</div>
  </div>

<script>
  const listInput = document.getElementById('listInput');
  const initBtn = document.getElementById('initBtn');
  const stepBtn = document.getElementById('stepBtn');
  const runBtn = document.getElementById('runBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedSlider = document.getElementById('speedSlider');
  const listContainer = document.getElementById('listContainer');
  const statusBox = document.getElementById('statusBox');

  let list = [];
  let pointer = -1; // -1 = chưa bắt đầu duyệt (p chưa được gán), n = đã tới NULL
  let started = false;
  let done = false;
  let autoTimer = null;

  function parseList() {
    return listInput.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
  }

  function renderList() {
    listContainer.innerHTML = '';
    if (list.length === 0) {
      const nullBox = document.createElement('div');
      nullBox.className = 'null-box';
      nullBox.textContent = 'head = NULL (danh sách rỗng)';
      listContainer.appendChild(nullBox);
      return;
    }
    list.forEach((v, i) => {
      const slot = document.createElement('div');
      slot.className = 'node-slot';

      let label = '';
      if (i === 0) label += 'head';
      if (started && pointer === i) label = (label ? label + ' / ' : '') + 'p';

      const isCurrent = started && pointer === i;
      const isVisited = started && pointer > i;

      slot.innerHTML = `
        ${label ? `<div class="${pointer === i && started ? 'pointer-label' : 'head-label'}">${label}</div>` : ''}
        <div class="node ${isCurrent ? 'current' : ''} ${isVisited ? 'visited' : ''}">
          <div class="cell-value">${v}</div>
          <div class="cell-next">•</div>
        </div>
      `;
      listContainer.appendChild(slot);

      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      listContainer.appendChild(arrow);
    });

    const nullSlot = document.createElement('div');
    nullSlot.className = 'node-slot';
    const atNull = started && pointer === list.length;
    nullSlot.innerHTML = `
      ${atNull ? '<div class="pointer-label">p</div>' : ''}
      <div class="null-box" style="${atNull ? 'border-color:var(--current);color:var(--current);' : ''}">NULL</div>
    `;
    listContainer.appendChild(nullSlot);
  }

  function setStatus(text, isDone) {
    statusBox.textContent = text;
    statusBox.className = 'status' + (isDone ? ' done' : '');
  }

  function initList() {
    stopAuto();
    list = parseList();
    pointer = -1;
    started = false;
    done = false;
    renderList();
    setStatus(`Đã khởi tạo danh sách gồm ${list.length} node. Nhấn "Từng bước" để bắt đầu duyệt từ head.`);
    stepBtn.disabled = false;
    runBtn.disabled = false;
  }

  function resetTraverse() {
    stopAuto();
    pointer = -1;
    started = false;
    done = false;
    renderList();
    setStatus('Con trỏ p đã về lại trước head. Nhấn "Từng bước" để duyệt lại.');
    stepBtn.disabled = false;
    runBtn.disabled = false;
  }

  function step() {
    if (done) return;
    if (list.length === 0) {
      setStatus('Danh sách rỗng (head = NULL), không có gì để duyệt.', true);
      done = true;
      return;
    }
    if (!started) {
      started = true;
      pointer = 0;
      setStatus(`p = head → p đang trỏ tới node có giá trị ${list[0]}.`);
      renderList();
      return;
    }
    if (pointer < list.length - 1) {
      pointer++;
      setStatus(`p = p.Next → p đang trỏ tới node có giá trị ${list[pointer]}.`);
      renderList();
      return;
    }
    pointer = list.length;
    done = true;
    setStatus('p = p.Next → p = NULL. Đã duyệt hết danh sách!', true);
    renderList();
    stopAuto();
    stepBtn.disabled = true;
    runBtn.disabled = true;
  }

  function stopAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  function runAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      step();
      if (done) stopAuto();
    }, parseInt(speedSlider.value, 10));
  }

  initBtn.addEventListener('click', initList);
  stepBtn.addEventListener('click', step);
  runBtn.addEventListener('click', runAuto);
  resetBtn.addEventListener('click', resetTraverse);

  initList();
</script>
</body>
</html>
