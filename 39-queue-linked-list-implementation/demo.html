<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Queue bằng danh sách liên kết</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --key: #1971c2;
    --current: #f08c00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .field { min-width: 140px; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .list-scroll { overflow-x: auto; padding: 40px 4px 20px; }
  .list-container { display: flex; align-items: center; min-width: max-content; }
  .node-slot { display: flex; flex-direction: column; align-items: center; position: relative; }
  .front-label, .rear-label {
    position: absolute; top: -26px; font-size: 0.72rem; font-weight: 700; white-space: nowrap;
  }
  .front-label { color: #2f9e44; }
  .rear-label { color: var(--current); }
  .node {
    display: flex;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .node.flash { border-color: var(--key); box-shadow: 0 0 0 3px rgba(25,113,194,0.18); }
  .cell-value { padding: 12px 16px; font-weight: 700; min-width: 44px; text-align: center; }
  .cell-next { padding: 12px 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-left: 1px solid var(--border); min-width: 28px; }
  .arrow { width: 34px; text-align: center; color: var(--muted); font-size: 1.3rem; }
  .null-box { padding: 12px 14px; border: 2px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .status { font-size: 0.95rem; padding: 10px 12px; border-radius: 8px; background: #f1f3f5; min-height: 20px; }
  .status.error { background: #ffe3e3; color: #c92a2a; }
  .status.ok { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>
  <h1>Cài đặt Queue bằng danh sách liên kết</h1>
  <p class="subtitle">Enqueue = thêm vào rear (cuối); Dequeue = lấy ở front (đầu) — nhờ giữ cả 2 con trỏ nên đều O(1).</p>

  <div class="panel">
    <div class="controls-row">
      <div class="field">
        <label>Giá trị</label>
        <input type="text" id="valueInput" value="5">
      </div>
      <button class="primary" id="enqueueBtn">Enqueue</button>
      <button id="dequeueBtn">Dequeue</button>
      <button id="frontBtn">Front (Peek)</button>
      <button id="resetBtn">Reset (rỗng)</button>
    </div>
  </div>

  <div class="panel">
    <div class="list-scroll">
      <div class="list-container" id="listContainer"></div>
    </div>
    <div class="status" id="statusBox">Queue đang rỗng. Thử Enqueue một vài giá trị.</div>
  </div>

<script>
  const valueInput = document.getElementById('valueInput');
  const enqueueBtn = document.getElementById('enqueueBtn');
  const dequeueBtn = document.getElementById('dequeueBtn');
  const frontBtn = document.getElementById('frontBtn');
  const resetBtn = document.getElementById('resetBtn');
  const listContainer = document.getElementById('listContainer');
  const statusBox = document.getElementById('statusBox');

  let queue = []; // queue[0] = front, queue[queue.length-1] = rear
  let flashIndex = -1;

  function setStatus(text, kind) {
    statusBox.textContent = text;
    statusBox.className = 'status' + (kind ? ' ' + kind : '');
  }

  function render() {
    listContainer.innerHTML = '';
    if (queue.length === 0) {
      const nullBox = document.createElement('div');
      nullBox.className = 'null-box';
      nullBox.textContent = 'front = rear = NULL (queue rỗng)';
      listContainer.appendChild(nullBox);
      return;
    }
    queue.forEach((v, i) => {
      const slot = document.createElement('div');
      slot.className = 'node-slot';
      const labels = [];
      if (i === 0) labels.push('<div class="front-label">front</div>');
      if (i === queue.length - 1) labels.push('<div class="rear-label">rear</div>');
      slot.innerHTML = `
        ${labels.join('')}
        <div class="node ${i === flashIndex ? 'flash' : ''}">
          <div class="cell-value">${v}</div>
          <div class="cell-next">•</div>
        </div>
      `;
      listContainer.appendChild(slot);
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      listContainer.appendChild(arrow);
    });
    const nullSlot = document.createElement('div');
    nullSlot.innerHTML = '<div class="null-box">NULL</div>';
    listContainer.appendChild(nullSlot);
  }

  function enqueue() {
    const v = valueInput.value.trim() || '0';
    queue.push(v);
    flashIndex = queue.length - 1;
    render();
    if (queue.length === 1) {
      setStatus(`Enqueue(${v}) → queue đang rỗng nên front = rear = newNode.`, 'ok');
    } else {
      setStatus(`Enqueue(${v}) → rear.Next = newNode, rồi rear = newNode.`, 'ok');
    }
  }

  function dequeue() {
    if (queue.length === 0) {
      setStatus('Underflow! Queue đang rỗng, không thể Dequeue.', 'error');
      return;
    }
    const v = queue[0];
    flashIndex = 0;
    render();
    const willBeEmpty = queue.length === 1;
    setStatus(`Dequeue() → lấy front.Data = ${v}, front = front.Next.` + (willBeEmpty ? ' Queue vừa trở nên rỗng → rear cũng phải gán về NULL.' : ''), 'ok');
    queue.shift();
    flashIndex = -1;
    setTimeout(render, 10);
  }

  function peekFront() {
    if (queue.length === 0) {
      setStatus('Queue đang rỗng, Front() không có giá trị để xem.', 'error');
      return;
    }
    flashIndex = 0;
    render();
    setStatus(`Front() → front.Data = ${queue[0]} (không thay đổi front/rear).`, 'ok');
  }

  function reset() {
    queue = [];
    flashIndex = -1;
    render();
    setStatus('Đã reset queue về rỗng.');
  }

  enqueueBtn.addEventListener('click', enqueue);
  dequeueBtn.addEventListener('click', dequeue);
  frontBtn.addEventListener('click', peekFront);
  resetBtn.addEventListener('click', reset);

  render();
</script>
</body>
</html>
