<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Phép quay AVL (LL/RR/LR/RL)</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4ea;
    --accent: #3b5bdb;
    --current: #f08c00;
    --miss: #e03131;
    --sorted: #2f9e44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 8px;
  }
  .radio-row { display: flex; gap: 14px; font-size: 0.88rem; flex-wrap: wrap; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tree-scroll { overflow-x: auto; min-height: 60px; }
  .status { font-size: 0.95rem; padding: 10px 12px; border-radius: 8px; background: #f1f3f5; min-height: 20px; margin-top: 10px; }
  .status.done { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>
  <h1>Phép quay AVL (LL / RR / LR / RL)</h1>
  <p class="subtitle">Chọn 1 trường hợp mất cân bằng, xem chỉ số BF tại mỗi node, rồi chạy từng bước để xem phép quay khôi phục cân bằng.</p>

  <div class="panel">
    <div class="controls-row">
      <div class="radio-row">
        <label><input type="radio" name="caseType" value="LL" checked> LL (quay phải đơn)</label>
        <label><input type="radio" name="caseType" value="RR"> RR (quay trái đơn)</label>
        <label><input type="radio" name="caseType" value="LR"> LR (quay kép trái-phải)</label>
        <label><input type="radio" name="caseType" value="RL"> RL (quay kép phải-trái)</label>
      </div>
      <button class="primary" id="buildBtn">Dựng lại ví dụ</button>
    </div>
    <div class="controls-row">
      <button id="stepBtn">Từng bước</button>
      <button id="runBtn">Chạy tự động</button>
      <div class="speed-row">
        Tốc độ:
        <input type="range" id="speedSlider" min="300" max="1500" value="700" step="100">
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--miss)"></span> BF vượt {-1,0,1} (mất cân bằng)</span>
      <span><span class="dot" style="background:var(--current)"></span> Node đang thao tác trong phép quay</span>
      <span><span class="dot" style="background:var(--sorted)"></span> BF hợp lệ</span>
    </div>
  </div>

  <div class="panel">
    <div class="tree-scroll"><svg id="treeSvg"></svg></div>
    <div class="status" id="statusBox">Chọn trường hợp rồi nhấn "Dựng lại ví dụ".</div>
  </div>

<script>
  const buildBtn = document.getElementById('buildBtn');
  const stepBtn = document.getElementById('stepBtn');
  const runBtn = document.getElementById('runBtn');
  const speedSlider = document.getElementById('speedSlider');
  const treeSvg = document.getElementById('treeSvg');
  const statusBox = document.getElementById('statusBox');

  const X_GAP = 64, Y_GAP = 84, RADIUS = 20, MARGIN = 30;

  let root = null;
  let steps = [];
  let stepPos = 0;
  let rotateHighlight = -1;
  let busy = false;

  function n(value, left, right) { return { value, left: left || null, right: right || null }; }
  function assignIds(node, ref) { if (!node) return; node.id = ref.next++; assignIds(node.left, ref); assignIds(node.right, ref); }

  function buildCase(caseType) {
    let tree;
    if (caseType === 'LL') tree = n(30, n(20, n(10)));
    else if (caseType === 'RR') tree = n(10, null, n(20, null, n(30)));
    else if (caseType === 'LR') tree = n(30, n(10, null, n(20)));
    else tree = n(10, null, n(30, n(20)));
    assignIds(tree, { next: 0 });
    return tree;
  }

  function computeHeights(node) {
    if (!node) return -1;
    node.h = 1 + Math.max(computeHeights(node.left), computeHeights(node.right));
    return node.h;
  }
  function bf(node) { return (node.left ? node.left.h : -1) - (node.right ? node.right.h : -1); }

  function rotateRight(y) { const x = y.left; const T2 = x.right; x.right = y; y.left = T2; return x; }
  function rotateLeft(x) { const y = x.right; const T2 = y.left; y.left = x; x.right = T2; return y; }

  function buildRotationSteps(caseType, r) {
    const s = [];
    if (caseType === 'LL') {
      s.push({ type: 'note', id: r.id, text: `Node ${r.value} có BF=2, con trái ${r.left.value} cũng lệch trái → trường hợp LL.` });
      s.push({ type: 'rotateRight', targetId: r.id, text: `Quay phải (Rotate Right) tại node ${r.value}.` });
    } else if (caseType === 'RR') {
      s.push({ type: 'note', id: r.id, text: `Node ${r.value} có BF=-2, con phải ${r.right.value} cũng lệch phải → trường hợp RR.` });
      s.push({ type: 'rotateLeft', targetId: r.id, text: `Quay trái (Rotate Left) tại node ${r.value}.` });
    } else if (caseType === 'LR') {
      s.push({ type: 'note', id: r.id, text: `Node ${r.value} có BF=2, nhưng con trái ${r.left.value} lệch phải → trường hợp LR (quay kép).` });
      s.push({ type: 'rotateLeft', targetId: r.left.id, text: `Bước 1: quay trái tại con trái ${r.left.value}.` });
      s.push({ type: 'rotateRight', targetId: r.id, text: `Bước 2: quay phải tại node ${r.value}.` });
    } else {
      s.push({ type: 'note', id: r.id, text: `Node ${r.value} có BF=-2, nhưng con phải ${r.right.value} lệch trái → trường hợp RL (quay kép).` });
      s.push({ type: 'rotateRight', targetId: r.right.id, text: `Bước 1: quay phải tại con phải ${r.right.value}.` });
      s.push({ type: 'rotateLeft', targetId: r.id, text: `Bước 2: quay trái tại node ${r.value}.` });
    }
    s.push({ type: 'done', text: 'Hoàn tất! Cây đã cân bằng lại (mọi BF trong {-1, 0, 1}).' });
    return s;
  }

  function applyStep(s) {
    if (s.type === 'rotateRight' || s.type === 'rotateLeft') {
      const fn = s.type === 'rotateRight' ? rotateRight : rotateLeft;
      if (root.id === s.targetId) { root = fn(root); }
      else if (root.left && root.left.id === s.targetId) { root.left = fn(root.left); }
      else if (root.right && root.right.id === s.targetId) { root.right = fn(root.right); }
      rotateHighlight = -1;
    } else if (s.type === 'note') {
      rotateHighlight = s.id;
    } else {
      rotateHighlight = -1;
    }
  }

  function layoutTree(node) {
    let counter = 0;
    function inorder(nd, depth) {
      if (!nd) return;
      inorder(nd.left, depth + 1);
      nd.x = counter++;
      nd.y = depth;
      inorder(nd.right, depth + 1);
    }
    inorder(node, 0);
  }
  function collectNodes(node, arr) {
    if (!node) return arr;
    arr.push(node);
    collectNodes(node.left, arr);
    collectNodes(node.right, arr);
    return arr;
  }

  function renderTree() {
    treeSvg.innerHTML = '';
    if (!root) { treeSvg.setAttribute('width', 200); treeSvg.setAttribute('height', 60); return; }
    computeHeights(root);
    layoutTree(root);
    const nodes = collectNodes(root, []);
    const maxX = Math.max(...nodes.map(nd => nd.x));
    const maxY = Math.max(...nodes.map(nd => nd.y));
    const width = MARGIN * 2 + maxX * X_GAP + RADIUS * 2;
    const height = MARGIN * 2 + maxY * Y_GAP + RADIUS * 2 + 20;
    treeSvg.setAttribute('width', width);
    treeSvg.setAttribute('height', height);
    function px(nd) { return MARGIN + RADIUS + nd.x * X_GAP; }
    function py(nd) { return MARGIN + RADIUS + nd.y * Y_GAP; }
    const ns = 'http://www.w3.org/2000/svg';
    nodes.forEach(nd => {
      [nd.left, nd.right].forEach(child => {
        if (!child) return;
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', px(nd)); line.setAttribute('y1', py(nd));
        line.setAttribute('x2', px(child)); line.setAttribute('y2', py(child));
        line.setAttribute('stroke', '#c7cad1'); line.setAttribute('stroke-width', 2);
        treeSvg.appendChild(line);
      });
    });
    nodes.forEach(nd => {
      const balance = bf(nd);
      const unbalanced = Math.abs(balance) >= 2;
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', px(nd)); circle.setAttribute('cy', py(nd)); circle.setAttribute('r', RADIUS);
      let fill = '#ffffff', stroke = '#c7cad1';
      if (rotateHighlight === nd.id) { fill = '#fff3bf'; stroke = '#f08c00'; }
      else if (unbalanced) { fill = '#ffe3e3'; stroke = '#e03131'; }
      else { stroke = '#2f9e44'; }
      circle.setAttribute('fill', fill);
      circle.setAttribute('stroke', stroke);
      circle.setAttribute('stroke-width', 2.5);
      treeSvg.appendChild(circle);

      const text = document.createElementNS(ns, 'text');
      text.setAttribute('x', px(nd)); text.setAttribute('y', py(nd) + 5);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', '13');
      text.setAttribute('font-weight', '700');
      text.textContent = nd.value;
      treeSvg.appendChild(text);

      const bfText = document.createElementNS(ns, 'text');
      bfText.setAttribute('x', px(nd)); bfText.setAttribute('y', py(nd) + RADIUS + 16);
      bfText.setAttribute('text-anchor', 'middle');
      bfText.setAttribute('font-size', '11');
      bfText.setAttribute('font-weight', '700');
      bfText.setAttribute('fill', unbalanced ? '#e03131' : '#6b7280');
      bfText.textContent = `BF=${balance}`;
      treeSvg.appendChild(bfText);
    });
  }

  function setStatus(text, isDone) {
    statusBox.textContent = text;
    statusBox.className = 'status' + (isDone ? ' done' : '');
  }

  function currentCase() {
    return document.querySelector('input[name="caseType"]:checked').value;
  }

  function buildExample() {
    stopAuto();
    root = buildCase(currentCase());
    steps = buildRotationSteps(currentCase(), root);
    stepPos = 0;
    rotateHighlight = -1;
    busy = true;
    renderTree();
    setStatus('Cây ban đầu đang mất cân bằng. Nhấn "Từng bước" để xem phép quay.');
    stepBtn.disabled = false;
    runBtn.disabled = false;
  }

  function step() {
    if (!busy || stepPos >= steps.length) return;
    const s = steps[stepPos];
    applyStep(s);
    renderTree();
    setStatus(s.text, s.type === 'done');
    stepPos++;
    if (s.type === 'done') {
      busy = false;
      stopAuto();
      stepBtn.disabled = true;
      runBtn.disabled = true;
    }
  }

  let autoTimer = null;
  function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function runAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      step();
      if (!busy) stopAuto();
    }, parseInt(speedSlider.value, 10));
  }

  buildBtn.addEventListener('click', buildExample);
  document.querySelectorAll('input[name="caseType"]').forEach(r => r.addEventListener('change', buildExample));
  stepBtn.addEventListener('click', step);
  runBtn.addEventListener('click', runAuto);

  buildExample();
</script>
</body>
</html>
